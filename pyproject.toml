[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-harness-chat"
version = "0.1.0"
description = "Evidence-backed memory distillation for Claude Code, driven from the chat: freeze, verify, plan, approve, evaluate, apply and roll back"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
memory-harness-chat = "memory_harness.cli:main"

[tool.setuptools.packages.find]
include = ["memory_harness*"]
